name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag version
        run: |
          RAW_TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="${RAW_TAG_VERSION}"

          if ! echo "${RAW_TAG_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "Tag ${GITHUB_REF_NAME} must look like v1.0 or v1.0.0"
            exit 1
          fi

          if echo "${RAW_TAG_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            TAG_VERSION="${RAW_TAG_VERSION}.0"
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"

          if [ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "Tag version ${TAG_VERSION} does not match package.json ${PACKAGE_VERSION}"
            exit 1
          fi

          if [ "${TAG_VERSION}" != "${MANIFEST_VERSION}" ]; then
            echo "Tag version ${TAG_VERSION} does not match manifest.json ${MANIFEST_VERSION}"
            exit 1
          fi

      - name: Run tests
        run: npm run verify

      - name: Package extension
        run: npm run pack

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            outputs/selection-translator-extension.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Selection Translator ${GITHUB_REF_NAME}" \
            --generate-notes
