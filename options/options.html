<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="options.pageTitle"></title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="settings-shell">
      <header class="settings-header">
        <img class="brand-mark" src="../assets/icon.svg" alt="" aria-hidden="true">
        <div class="settings-heading">
          <h1 data-i18n="app.name"></h1>
          <p data-i18n="options.tagline"></p>
        </div>
        <button type="button" id="theme-toggle" class="theme-toggle">
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 14.2A7.7 7.7 0 0 1 9.8 3a8.7 8.7 0 1 0 11.2 11.2Z"></path>
          </svg>
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
          </svg>
        </button>
      </header>

      <form id="settings-form" class="settings-form">
        <input type="hidden" name="themePreference" value="system">

        <section class="settings-section">
          <div class="section-head">
            <h2 data-i18n="options.translation.title"></h2>
            <p data-i18n="options.translation.description"></p>
          </div>

          <div class="field-grid">
            <label class="field">
              <span data-i18n="options.targetLanguage"></span>
              <select name="targetLanguage"></select>
            </label>

            <label class="field" data-shown-when="manual-source">
              <span data-i18n="options.sourceLanguage"></span>
              <input name="sourceLanguage" type="text" placeholder="en" autocomplete="off">
              <span class="field-hint" data-i18n="options.sourceLanguageHint"></span>
            </label>
          </div>

          <label class="switch-field">
            <input type="checkbox" name="autoDetectSource">
            <span class="switch-text">
              <span class="switch-title" data-i18n="options.autoDetectSource"></span>
              <span class="field-hint" data-i18n="options.autoDetectSourceHint"></span>
            </span>
          </label>
        </section>

        <section class="settings-section">
          <div class="section-head">
            <h2 data-i18n="options.provider.title"></h2>
            <p data-i18n="options.provider.description"></p>
          </div>

          <label class="field">
            <span data-i18n="options.providerService"></span>
            <select name="provider">
              <option value="google" data-i18n="options.providerGoogle"></option>
              <option value="yandex" data-i18n="options.providerYandex"></option>
              <option value="libretranslate" data-i18n="options.providerLibreTranslate"></option>
            </select>
          </label>

          <div class="provider-fields" data-provider="google">
            <p class="provider-hint" data-i18n="options.googleHint"></p>
          </div>

          <div class="provider-fields" data-provider="yandex">
            <div class="field-grid">
              <label class="field">
                <span data-i18n="options.yandexApiKey"></span>
                <input name="yandexApiKey" type="password" autocomplete="off" placeholder="Api-Key">
              </label>

              <label class="field">
                <span data-i18n="options.yandexFolderId"></span>
                <input name="yandexFolderId" type="text" autocomplete="off" placeholder="b1g...">
                <span class="field-hint" data-i18n="options.yandexFolderIdHint"></span>
              </label>
            </div>
          </div>

          <div class="provider-fields" data-provider="libretranslate">
            <div class="field-grid">
              <label class="field">
                <span data-i18n="options.endpoint"></span>
                <input name="endpoint" type="url" placeholder="https://translate.example.com">
                <span class="field-hint" data-i18n="options.endpointHint"></span>
              </label>

              <label class="field">
                <span data-i18n="options.libreTranslateApiKey"></span>
                <input name="libreTranslateApiKey" type="password" autocomplete="off" data-i18n-placeholder="options.libreTranslateApiKeyPlaceholder">
              </label>
            </div>
          </div>
        </section>

        <section class="settings-section">
          <div class="section-head">
            <h2 data-i18n="options.panel.title"></h2>
            <p data-i18n="options.panel.description"></p>
          </div>

          <div class="field field-slider">
            <div class="field-head">
              <span data-i18n="options.panelOpacity"></span>
              <output id="opacity-output" class="field-value" for="panelOpacity">75%</output>
            </div>
            <input name="panelOpacity" type="range" min="25" max="100" step="5" aria-describedby="opacity-hint">
            <span class="field-hint" id="opacity-hint" data-i18n="options.panelOpacityHint"></span>

            <div class="opacity-preview" aria-hidden="true">
              <div class="preview-page">
                <span class="preview-line"></span>
                <span class="preview-line"></span>
                <span class="preview-line"></span>
                <span class="preview-line"></span>
                <span class="preview-line"></span>
                <span class="preview-line"></span>
              </div>
              <div class="preview-panel">
                <div class="preview-panel-head" data-i18n="options.previewLanguage"></div>
                <div class="preview-panel-body" data-i18n="options.previewText"></div>
              </div>
            </div>
          </div>

          <label class="switch-field">
            <input type="checkbox" name="showSelectionToolbar">
            <span class="switch-text">
              <span class="switch-title" data-i18n="options.showSelectionToolbar"></span>
              <span class="field-hint" data-i18n="options.showSelectionToolbarHint"></span>
            </span>
          </label>

          <label class="switch-field">
            <input type="checkbox" name="keepPanelOpen">
            <span class="switch-text">
              <span class="switch-title" data-i18n="options.keepPanelOpen"></span>
            </span>
          </label>
        </section>

        <section class="settings-section">
          <div class="section-head">
            <h2 data-i18n="options.reliability.title"></h2>
            <p data-i18n="options.reliability.description"></p>
          </div>

          <label class="switch-field">
            <input type="checkbox" name="autoFallbackProvider">
            <span class="switch-text">
              <span class="switch-title" data-i18n="options.autoFallbackProvider"></span>
              <span class="field-hint" data-i18n="options.autoFallbackProviderHint"></span>
            </span>
          </label>

          <label class="field field-compact">
            <span data-i18n="options.maxCharacters"></span>
            <input name="maxCharacters" type="number" min="100" max="50000" step="100" inputmode="numeric">
            <span class="field-hint" data-i18n="options.maxCharactersHint"></span>
          </label>
        </section>

        <section class="settings-section">
          <div class="section-head">
            <h2 data-i18n="options.interface.title"></h2>
            <p data-i18n="options.interface.description"></p>
          </div>

          <label class="field field-compact">
            <span data-i18n="options.uiLanguage"></span>
            <select name="uiLanguage">
              <option value="auto" data-i18n="options.uiLanguageAuto"></option>
            </select>
            <span class="field-hint" data-i18n="options.uiLanguageHint"></span>
          </label>
        </section>

        <footer class="settings-actions">
          <span id="status" class="status" role="status"></span>
          <button type="button" id="reset-button" class="secondary-button" data-i18n="options.reset"></button>
          <button type="submit" id="save-button" data-i18n="options.save"></button>
        </footer>
      </form>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
