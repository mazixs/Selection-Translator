<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="app.name"></title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <img class="brand-mark" src="../assets/icon.svg" alt="" aria-hidden="true">
        <div>
          <h1 data-i18n="app.name"></h1>
          <p id="status-line" data-i18n="popup.loading"></p>
        </div>
      </header>

      <dl class="settings-summary">
        <div>
          <dt data-i18n="popup.language"></dt>
          <dd id="target-language">-</dd>
        </div>
        <div>
          <dt data-i18n="popup.provider"></dt>
          <dd id="provider-status">-</dd>
        </div>
      </dl>

      <button type="button" id="open-options" data-i18n="common.settings"></button>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
